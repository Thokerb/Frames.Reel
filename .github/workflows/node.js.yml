name: Create Web Worker Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Grammar
        run: npm run langium:generate:production

      - name: Build DSL
        run: npm run build
        
      - name: Build worker script
        run: npm run build:worker

      - name: Build extension
        run: npm run package

      - name: Generate tag and release name
        id: version
        run: |
          TAG_NAME="manual-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
  
      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Thokerb/Frames.Reel.git ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: "Manual release created by GitHub Actions."
          files: |
            ./public/reel-server-worker.js
            ./Reel-0.0.1.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
